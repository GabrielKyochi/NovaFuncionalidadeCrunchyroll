<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Style/style.css">
    <script src="../scripts/script.js"></script>
    <title>Comunidade - Conversa</title>
</head>
<body>
   <header>
    <div class="header">
        <div>
            <p id="voltar">Voltar</p>
            <img id="tamanhoSeta" src="../assets/icons/setaEsquerda.png" alt="Seta para voltar" onclick="voltarPagina()">
        </div>
        <h2>Comunidades</h2>
        <img class="iconePesquisa" src="../assets/icons/imagemPesquisa.png" alt="Icone de pesquisa">
        <label for="escolherComunidade"></label>
        <input type="text" class="quadradoPesquisar" name="escolherComunidade" placeholder="Pesquisar Comunidade">
    </div>
   </header> 

   <main id="centralizacaoCapasConversa">
    <img class="capasAnimeConversa" src="../assets/capasAnime/VinlandSaga.jpg" alt="Capa do anime Vinland Saga">
    <br>
    <div id="bordaConversa">
        <div>
            <div class="displayFlex">
                <img class="displayFlex" src="../assets/icons/iconePerfilConversa1.png" alt="Icone de Perfil">
                <div id="quadradoPerfil1"><p>"This anime it's amazing, I love the first season!"</p></div>
            </div>
           
            <div class="displayFlex">
                <div id="quadradoPerfil2"><p>"Guys, have you seen the second season too?"</p></div>
                <img class="displayFlex" src="../assets/icons/iconePerfilConversa2.png" alt="Icone de Perfil">
            </div>
           
            <div class="displayFlex">
                <img class="displayFlex" src="../assets/icons/iconePerfilConversa3.png" alt="Icone de Perfil">
                <div id="quadradoPerfil3"><p>"Yes, it's really very good, right?"</p></div>
            </div>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
        </div>
    </div>
 
   </main>

   <footer id="footerConversa">
    <div>
        <img class="iconesFooter" src="../assets/icons/imagemInicio.png" alt="Icone de Inicio">
        <img class="iconesFooter" src="../assets/icons/imagemMinhasListas.png" alt="Icone de Minhas Listas">
        <img class="iconesFooter" src="../assets/icons/imagemExplorar.png" alt="Icone de Explorar">
        <img class="iconesFooter" src="../assets/icons/imagemSimulcasts.png" alt="Icone de Simulcasts">
        <img class="iconesFooter" src="../assets/icons/imagemConta.png" alt="Icone de Conta">
        <img class="iconesFooter" src="../assets/icons/imagemComunidade.png" alt="Icone de Comunidade">
    </div>
   </footer>
</body>
</html>
