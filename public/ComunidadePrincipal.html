<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="../Style/style.css">
    <script src="../scripts/script.js"></script>
    <title>Comunidade</title>
</head>
<body>
    <header>
        <div class="header">
        <h2>Comunidades</h2>
        <img class="iconePesquisa" src="../assets/icons/imagemPesquisa.png" alt="Icone de pesquisa">
        <label for="escolherComunidade"></label>
        <input type="text" class="quadradoPesquisar" name="escolherComunidade" placeholder="Pesquisar Comunidade">
        </div>
    </header>

    <main>
        <div class="centralizacaoCapas">
            <div>
                <img class="capasAnimePrincipal" src="../assets/capasAnime/VinlandSaga.jpg" alt="Capa do anime Vinland Saga">
            </div>
            <br>
            <div>
                <img class="capasAnimePrincipal" src="../assets/capasAnime/DragonBallZ.png" alt="Capa do anime Dragon Ball Z">
            </div>
            <br>
            <div>
                <img class="capasAnimePrincipal" src="../assets/capasAnime/DanDanDan.jpg" alt="Capa do anime Dan Dan Dan">
            </div>
            <br>
           <div>
            <img class="capasAnimePrincipal" src="../assets/capasAnime/Bleach.png" alt="Capa do anime Bleach">
           </div>
        </div>
    </main>

    <footer id="footerPrincipal">
        <div>
            <img class="iconesFooter" src="../assets/icons/imagemInicio.png" alt="Icone de Inicio">
            <img class="iconesFooter" src="../assets/icons/imagemMinhasListas.png" alt="Icone de Minhas Listas">
            <img class="iconesFooter" src="../assets/icons/imagemExplorar.png" alt="Icone de Explorar">
            <img class="iconesFooter" src="../assets/icons/imagemSimulcasts.png" alt="Icone de Simulcasts">
            <img class="iconesFooter" src="../assets/icons/imagemConta.png" alt="Icone de Conta">
            <img class="iconesFooter" src="../assets/icons/imagemComunidade.png" alt="Icone de Comunidade">
        </div>
    </footer>
</body>
</html>
